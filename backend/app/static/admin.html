<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>自然记 · 管理后台</title><link rel="stylesheet" href="/admin.css"><script src="/admin/workspace.js" defer></script><script src="/admin/preview.js" defer></script><script src="/admin.js" defer></script></head>
<body><header><span class="brand">自然记</span><span>管理后台</span><button id="logout" hidden>退出登录</button></header>
<main><p id="notice" role="status"></p><section id="loginPanel" class="card narrow"><h1>管理员登录</h1><p>仅限自然记管理员使用</p><form id="loginForm"><label>账号<input name="username" autocomplete="username" required></label><label>密码<input name="password" type="password" autocomplete="current-password" required></label><button>登录</button></form></section>
<section id="passwordPanel" class="card narrow" hidden><h1>修改管理员密码</h1><form id="passwordForm"><label>当前密码<input name="current_password" type="password" required></label><label>新密码（至少 12 位）<input name="new_password" type="password" minlength="12" required></label><button>保存密码</button></form></section>
<section id="workspace" hidden><aside class="sidebar"><p class="sidebarTitle">观察与创作</p><nav id="navigation" aria-label="后台导航"></nav><p class="sidebarNote">从用户到作品<br>查看每一次创作</p></aside><div class="workArea"><div class="toolbar"><div><h1 id="sectionTitle">概览</h1><p id="sectionDescription"></p></div><button id="refresh" class="secondary">刷新</button></div><div id="contentTabs" class="tabs" aria-label="作品类型"></div><form id="filterForm" class="filters"><label class="searchLabel"><span>搜索</span><input id="search" placeholder="搜索用户、标题或编号"></label><label id="statusLabel"><span>任务状态</span><select id="statusFilter"><option value="">全部状态</option><option value="queued">排队中</option><option value="running">处理中</option><option value="succeeded">已完成</option><option value="failed">失败</option><option value="cancelled">已停止</option></select></label><label id="startLabel"><span>开始日期</span><input id="startFilter" type="date"></label><label id="endLabel"><span>结束日期</span><input id="endFilter" type="date"></label><button type="submit">筛选</button><button id="resetFilters" type="button" class="secondary">重置</button></form><div id="scopeBar" hidden></div><section id="summary" class="summary"></section><div id="pageActions"></div><section id="contentGrid" class="contentGrid"></section><section class="card tableWrap"><table><thead id="columns"></thead><tbody id="rows"></tbody></table></section><p id="empty" class="emptyState" hidden>暂无记录</p><div class="pagination"><button id="previous" class="secondary" hidden>上一页</button><span id="pageNumber"></span><button id="next" class="secondary" hidden>下一页</button></div>
<section id="runtimePanel" hidden></section>
<dialog id="detailDialog" class="detailDrawer"><div class="drawerHeader"><h2 id="detailTitle">详情</h2><button id="closeDetail" class="secondary" aria-label="关闭详情">关闭</button></div><section id="actions"><div id="recordInfo"></div><div id="detailMedia"></div><div id="relatedLinks" class="tabs"></div><div id="userContent"></div><div id="actionButtons"></div><details id="technicalDetails"><summary>技术详情</summary><pre id="detail"></pre></details></section>
<section id="quotaPanel" class="card"><h2>调整额度</h2><form id="quotaForm" class="grid"><label>模型<select name="provider"><option value="qwen">识别与问答</option><option value="image">生图与润色</option></select></label><label>操作<select name="mode"><option value="topup">追加今日额度</option><option value="personal">个人每日额度（次日）</option><option value="default">默认每日额度（次日）</option><option value="reset">个人恢复默认（次日）</option></select></label><label>用户 ID<input name="user_id"></label><label>金额（元）<input name="amount" type="number" min="0" step="0.000001" value="5" required></label><label>调整说明<input name="note" required></label><button>提交调整</button></form></section>
</dialog><section id="announcementPanel" class="card"><h2>新公告</h2><form id="announcementForm" class="grid"><label>标题<input name="title" required maxlength="200"></label><label>正文<textarea name="text" required></textarea></label><label>指定用户 ID（逗号分隔，留空为全部）<input name="user_ids"></label><label>开始时间<input name="starts_at" type="datetime-local" required></label><label>结束时间<input name="ends_at" type="datetime-local" required></label><label>发布方式<select name="status"><option value="draft">保存草稿</option><option value="published">按设定时间发布</option></select></label><button>预览并保存</button></form></section>
</div></section></main><footer>用户私人数据仅用于已授权的管理用途。对账须以服务商实际账单为依据。</footer></body></html>
